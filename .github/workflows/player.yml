name: Player and worker

on:
  push:
    branches: ["main", "v4/**", "claude/**"]
    paths: ["player/**", "packages/**", "fixtures/**", ".github/workflows/player.yml"]
  pull_request:
    branches: ["main"]
    paths: ["player/**", "packages/**", "fixtures/**", ".github/workflows/player.yml"]

permissions:
  contents: read

concurrency:
  group: player-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Player (${{ matrix.os }})
    # The player ships for Windows and macOS (decision 001); Linux runs the same tests, the
    # lints and the end-to-end run. The runners' own rustup is used: no third-party action.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Native libraries (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg pkg-config clang
          libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
          libswresample-dev libavfilter-dev libavdevice-dev libxkbcommon-dev libwayland-dev
      - name: Native libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg@7 pkg-config && echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> "$GITHUB_ENV" && echo "$(brew --prefix ffmpeg@7)/bin" >> "$GITHUB_PATH"
      - name: Native libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath $env:RUNNER_TEMP
          $dir = Get-ChildItem "$env:RUNNER_TEMP" -Directory -Filter "ffmpeg-n7.1*" | Select-Object -First 1
          "FFMPEG_DIR=$($dir.FullName)" >> $env:GITHUB_ENV
          "$($dir.FullName)\bin" >> $env:GITHUB_PATH
      - name: Lints
        if: runner.os == 'Linux'
        working-directory: player
        run: cargo fmt --check && cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        working-directory: player
        run: cargo test --workspace
      - name: Sync bench (full length)
        working-directory: player
        run: cargo run --release -p kp-syncbench
      - name: The player binary
        working-directory: player
        run: cargo build --release -p kp-player
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os != 'Linux'
        with:
          name: kp-player-${{ runner.os }}
          path: |
            player/target/release/kp-player
            player/target/release/kp-player.exe
          retention-days: 14

  e2e:
    name: Server, worker and player end to end (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg pkg-config clang
          libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
          libswresample-dev libavfilter-dev libavdevice-dev libxkbcommon-dev libwayland-dev
      - run: rustup toolchain install stable --profile minimal
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
      - run: cargo build -p kp-player
        working-directory: player
      - run: uv run python player/tests/e2e.py

  worker-windows:
    name: Worker, server and contracts on Windows (no GPU)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q packages/contracts packages/worker packages/server
