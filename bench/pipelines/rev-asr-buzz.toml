# BuzzASR Galician Whisper large-v3, whole song with Silero VAD
name = "rev-asr-buzz"
description = "Mel-Band RoFormer (Kim, 8 s) + BuzzASR Galician Whisper large-v3, whole song with Silero VAD + line segmenter + lyrics aligner"

[steps.separator]
target = "karaoke_engine.separation:RoformerSeparator"
params = { model = "vocals_mel_band_roformer.ckpt", segment_size = 801 }

[steps.transcriber]
target = "karaoke_engine.transcribe:WhisperTranscriber"
params = { model = "buzz-large-v3-gl" }

[steps.segmenter]
target = "karaoke_engine.transcribe:LineSegmenter"

[steps.aligner]
target = "karaoke_engine.align.aligner:LyricsAligner"
# The single-model aligner, written out so that these runs compare transcribers only.
params = { second = "", rest_penalty = 0.0 }
