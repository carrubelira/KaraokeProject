# Nós Whisper large-v3-turbo Galician reading stretches of singing of at most 12 s
name = "rev-asr-nos-voice12"
description = "Mel-Band RoFormer (Kim, 8 s) + Nós Whisper large-v3-turbo Galician reading stretches of singing of at most 12 s + line segmenter + lyrics aligner"

[steps.separator]
target = "karaoke_engine.separation:RoformerSeparator"
params = { model = "vocals_mel_band_roformer.ckpt", segment_size = 801 }

[steps.transcriber]
target = "karaoke_engine.transcribe:WhisperTranscriber"
params = { model = "nos-turbo-gl", by_voice = true, stretch_seconds = 12.0 }

[steps.segmenter]
target = "karaoke_engine.transcribe:LineSegmenter"

[steps.aligner]
target = "karaoke_engine.align.aligner:LyricsAligner"
# The single-model aligner, written out so that these runs compare transcribers only.
params = { second = "", rest_penalty = 0.0 }
