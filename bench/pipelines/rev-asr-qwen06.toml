# Qwen3-ASR 0.6B reading each stretch of singing on its own, language given
name = "rev-asr-qwen06"
description = "Mel-Band RoFormer (Kim, 8 s) + Qwen3-ASR 0.6B reading each stretch of singing on its own, language given + line segmenter + lyrics aligner"

[steps.separator]
target = "karaoke_engine.separation:RoformerSeparator"
params = { model = "vocals_mel_band_roformer.ckpt", segment_size = 801 }

[steps.transcriber]
target = "karaoke_bench.baseline.qwen:QwenTranscriber"
params = { model = "0.6b" }

[steps.segmenter]
target = "karaoke_engine.transcribe:LineSegmenter"

[steps.aligner]
target = "karaoke_engine.align.aligner:LyricsAligner"
# The single-model aligner, written out so that these runs compare transcribers only.
params = { second = "", rest_penalty = 0.0 }
