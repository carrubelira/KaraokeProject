# each language's CTC model averaged half and half with the music model; resting between words of a line costs 0.05 per silent frame
name = "rev-final-a"
description = "Mel-Band RoFormer (Kim, 8 s) + Whisper + lyrics aligner (each language's CTC model averaged half and half with the music model; resting between words of a line costs 0.05 per silent frame)"

[steps.separator]
target = "karaoke_engine.separation:RoformerSeparator"
params = { model = "vocals_mel_band_roformer.ckpt", segment_size = 801 }

[steps.transcriber]
target = "karaoke_engine.transcribe:WhisperTranscriber"

[steps.segmenter]
target = "karaoke_engine.transcribe:LineSegmenter"

[steps.aligner]
target = "karaoke_engine.align.aligner:LyricsAligner"
params = { second = "music-w2vbert-ctc", second_weight = 0.5, rest_penalty = 0.05 }
