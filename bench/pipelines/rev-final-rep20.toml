# the music model at 0.3, resting 0.05, singing a stanza's lines again costs 20
name = "rev-final-rep20"
description = "Mel-Band RoFormer (Kim, 8 s) + Whisper + lyrics aligner (the music model at 0.3, resting 0.05, singing a stanza's lines again costs 20)"

[steps.separator]
target = "karaoke_engine.separation:RoformerSeparator"
params = { model = "vocals_mel_band_roformer.ckpt", segment_size = 801 }

[steps.transcriber]
target = "karaoke_engine.transcribe:WhisperTranscriber"

[steps.segmenter]
target = "karaoke_engine.transcribe:LineSegmenter"

[steps.aligner]
target = "karaoke_engine.align.aligner:LyricsAligner"
params = { second = "music-w2vbert-ctc", second_weight = 0.3, rest_penalty = 0.05, repeat_penalty = 20.0 }
