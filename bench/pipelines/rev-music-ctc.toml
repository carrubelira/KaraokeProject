# The music-trained CTC model for every language, in place of each language's speech model
name = "rev-music-ctc"
description = "Mel-Band RoFormer (Kim, 8 s) + Whisper + lyrics aligner (w2v-BERT 2.0 music lyrics CTC for every language)"

[steps.separator]
target = "karaoke_engine.separation:RoformerSeparator"
params = { model = "vocals_mel_band_roformer.ckpt", segment_size = 801 }

[steps.transcriber]
target = "karaoke_engine.transcribe:WhisperTranscriber"

[steps.segmenter]
target = "karaoke_engine.transcribe:LineSegmenter"

[steps.aligner]
target = "karaoke_engine.align.aligner:LyricsAligner"
params = { model = "music-w2vbert-ctc" }
