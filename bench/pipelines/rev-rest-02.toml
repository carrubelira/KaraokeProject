# c4-default with a cost of 0.2 per silent frame for resting between two words of a line
name = "rev-rest-02"
description = "Mel-Band RoFormer (Kim, 8 s) + Whisper + lyrics aligner (each language's CTC model; resting between words of a line costs 0.2 per silent frame)"

[steps.separator]
target = "karaoke_engine.separation:RoformerSeparator"
params = { model = "vocals_mel_band_roformer.ckpt", segment_size = 801 }

[steps.transcriber]
target = "karaoke_engine.transcribe:WhisperTranscriber"

[steps.segmenter]
target = "karaoke_engine.transcribe:LineSegmenter"

[steps.aligner]
target = "karaoke_engine.align.aligner:LyricsAligner"
params = { rest_penalty = 0.2 }
