# each language's model alone, resting costs 0.05 (to tell the two changes apart on repeats)
name = "rev-single-rest005"
description = "Mel-Band RoFormer (Kim, 8 s) + Whisper + lyrics aligner (each language's model alone, resting costs 0.05 (to tell the two changes apart on repeats))"

[steps.separator]
target = "karaoke_engine.separation:RoformerSeparator"
params = { model = "vocals_mel_band_roformer.ckpt", segment_size = 801 }

[steps.transcriber]
target = "karaoke_engine.transcribe:WhisperTranscriber"

[steps.segmenter]
target = "karaoke_engine.transcribe:LineSegmenter"

[steps.aligner]
target = "karaoke_engine.align.aligner:LyricsAligner"
params = { second = "", rest_penalty = 0.05 }
