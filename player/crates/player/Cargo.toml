[package]
name = "kp-player"
description = "The native karaoke player: follows the server, plays every output in sync."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kp-player"
path = "src/main.rs"

[features]
default = ["native", "pitch"]
# Real audio devices (WASAPI, CoreAudio) and windows on every screen.
native = ["dep:cpal", "dep:winit", "dep:wgpu", "dep:glyphon", "dep:pollster"]
# Transposition with Signalsmith Stretch (C++, built with the crate).
pitch = ["dep:signalsmith-stretch"]

[dependencies]
kp-clock = { path = "../clock" }
kp-mix = { path = "../mix" }
kp-proto = { path = "../proto" }
kp-net = { path = "../net" }
kp-cache = { path = "../cache" }
kp-core = { path = "../core" }
kp-layout = { path = "../layout" }
kp-media = { path = "../media" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
cpal = { version = "0.15.3", optional = true }
winit = { version = "0.30", optional = true }
wgpu = { version = "22.1", optional = true }
glyphon = { version = "0.6", optional = true }
pollster = { version = "0.3", optional = true }
signalsmith-stretch = { version = "0.1.3", optional = true }

[lints]
workspace = true
